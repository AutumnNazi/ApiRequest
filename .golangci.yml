# golangci-lint v2 配置：保守集——只开当前信号面干净的 linter。
# 原则：CI 零告警成为门槛；新 linter 在本地清零存量后才进这个列表。
version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - govet
    - ineffassign
    - unused
    - errcheck    # 错误必须显式处理或显式忽略（_ =）；2026-09-11 清扫 176 处后转正
    - errorlint   # 错误断言应 errors.As / %w 包装检查
    - copyloopvar # Go 1.22+ 循环变量语义
    - misspell
    - unconvert
    - staticcheck # SA bug 类 + 简化建议；2026-09-13 清扫存量后转正
  settings:
    staticcheck:
      checks:
        # all 减 ST1003：初始缩略词大写命名（redirectURI 等）与全库既有
        # uri/url 惯例冲突，改名属纯 churn 无 bug 价值
        - all
        - -ST1003
    errcheck:
      exclude-functions:
        # goja 新建对象的 Set 只在接收方为 nil/非对象时出错；
        # 本库调用点全部以 NewObject() 起始，属构造性不可能
        - (*github.com/dop251/goja.Object).Set
        - (*github.com/dop251/goja.Runtime).Set
        - (*github.com/dop251/goja.Array).Set
        - (github.com/dop251/goja.Value).Set
  exclusions:
    paths:
      # 前端依赖树里的 Go 参考实现（flatted 等）不属于本模块。
      # go.mod 的 ignore 指令本可整目录排除，但 wails CLI 内嵌的旧 modfile
      # 解析器不认识该指令导致 wails build 报错，故退回 lint 层排除
      - frontend/node_modules
    rules:
      # 测试文件的 defer Close / fixture 写入按测试语义忽略
      - path: _test\.go
        linters:
          - errcheck
  # 未开（按需逐个清零存量后转正）：
  #   errchkjson / wrapcheck 等 —— 同上策略

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
