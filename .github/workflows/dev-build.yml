name: Dev Build

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  backend:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Go vet
        # 仅 backend 包：根目录 main 包引入 Wails，在无 WebKitGTK 头文件的
        # runner 上无法通过 CGO 编译；main 包由 desktop job 的 wails build 验证
        run: go vet ./backend/...

      - name: Go tests
        run: go test ./backend/...

  frontend:
    name: Frontend type-check & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm --prefix frontend ci

      - name: Type-check & build
        run: npm --prefix frontend run build

  desktop:
    name: Wails build (${{ matrix.os }})
    needs: [backend, frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
          - os: macos-latest
            label: macos
          - os: ubuntu-latest
            label: linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux WebKit dependencies
        if: matrix.label == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Wails build
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.label }}" == "linux" ]]; then
            wails build -tags webkit2_41
          else
            wails build
          fi

      - name: Package dev asset
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::7}"
          mkdir -p dist
          case "${{ matrix.label }}" in
            windows)
              cp build/bin/ApiRequest.exe "dist/ApiRequest-dev-${SHORT_SHA}-Windows-Amd64.exe"
              ;;
            macos)
              cd build/bin && zip -qr "../../dist/ApiRequest-dev-${SHORT_SHA}-MacOS.zip" ApiRequest.app
              ;;
            linux)
              cp build/bin/ApiRequest "dist/ApiRequest-dev-${SHORT_SHA}-Linux-Amd64"
              chmod +x "dist/ApiRequest-dev-${SHORT_SHA}-Linux-Amd64"
              ;;
          esac

      - name: Upload dev artifact
        uses: actions/upload-artifact@v4
        with:
          name: ApiRequest-dev-${{ matrix.label }}
          path: dist/
          retention-days: 7

  publish-dev:
    name: Update dev-latest release
    # 仅 dev 分支推送时更新（PR 只跑构建验证，不发布）
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: desktop
    runs-on: ubuntu-latest
    steps:
      - name: Download all dev artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: ApiRequest-dev-*
          merge-multiple: true

      - name: Recreate dev-latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::7}"
          # 删除旧的 dev-latest release 与 tag（首次运行不存在，容错）
          gh release delete dev-latest --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create dev-latest \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "🧪 Dev Build (dev-${SHORT_SHA})" \
            --notes "Rolling development build from \`dev\` @ ${GITHUB_SHA}.

Automatically updated on every push to \`dev\`. **Unstable — for testing only.** For stable versions use a \`vX.Y.Z\` release." \
            --prerelease \
            dist/*
