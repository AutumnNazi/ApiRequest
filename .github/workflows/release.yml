name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Go tests
        run: go test ./backend/...

  build:
    name: Build (${{ matrix.label }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-amd64
            artifact: ApiRequest.exe
            asset: ApiRequest-windows-amd64.exe
          - os: macos-latest
            label: darwin-universal
            artifact: ApiRequest.app
            asset: ApiRequest-darwin-universal.zip
          - os: ubuntu-latest
            label: linux-amd64
            artifact: ApiRequest
            asset: ApiRequest-linux-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux WebKit dependencies
        if: matrix.label == 'linux-amd64'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Wails build
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.label }}" in
            darwin-universal)
              wails build -platform darwin/universal
              ;;
            linux-amd64)
              wails build -tags webkit2_41
              ;;
            *)
              wails build
              ;;
          esac

      - name: Package artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          case "${{ matrix.label }}" in
            windows-amd64)
              cp "build/bin/${{ matrix.artifact }}" "dist/${{ matrix.asset }}"
              ;;
            darwin-universal)
              cd build/bin && zip -r "../../dist/${{ matrix.asset }}" "${{ matrix.artifact }}"
              ;;
            linux-amd64)
              cp "build/bin/${{ matrix.artifact }}" "dist/${{ matrix.asset }}"
              chmod +x "dist/${{ matrix.asset }}"
              ;;
          esac

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.label }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: release-*
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
